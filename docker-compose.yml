x-api-environment: &api-environment
  DATABASE_URL: ${DOCKER_DATABASE_URL}
  S3_ENDPOINT_URL: ${DOCKER_S3_ENDPOINT_URL}
  OPENSEARCH_URL: ${DOCKER_OPENSEARCH_URL}
  KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  LITELLM_BASE_URL: ${DOCKER_LITELLM_BASE_URL:-}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    container_name: agentic-rag-api
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    extra_hosts: *host-gateway
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - appnet
      - dbnet
      - eventnet
      - storagenet
      - searchnet

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    container_name: agentic-rag-ingestion-worker
    command: ["python", "-m", "agentic_rag.workers.ingestion"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      db-seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - dbnet
      - eventnet
      - storagenet

  indexing-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    container_name: agentic-rag-indexing-worker
    command: ["python", "-m", "agentic_rag.workers.indexing"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      db-seed:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - dbnet
      - eventnet
      - searchnet

  embedding-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    container_name: agentic-rag-embedding-worker
    command: ["python", "-m", "agentic_rag.workers.embedding"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    extra_hosts: *host-gateway
    depends_on:
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - appnet
      - dbnet
      - eventnet

  kafka:
    image: apache/kafka:3.7.2
    container_name: agentic-rag-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "${KAFKA_PORT:-9092}:9094"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventnet

  kafka-init:
    image: apache/kafka:3.7.2
    container_name: agentic-rag-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_INGESTION_PARSE_TOPIC: ${KAFKA_INGESTION_PARSE_TOPIC:-ingestion.parse}
      KAFKA_INGESTION_METADATA_TOPIC: ${KAFKA_INGESTION_METADATA_TOPIC:-ingestion.metadata}
      KAFKA_INGESTION_CHUNK_TOPIC: ${KAFKA_INGESTION_CHUNK_TOPIC:-ingestion.chunk}
      KAFKA_INGESTION_EMBED_TOPIC: ${KAFKA_INGESTION_EMBED_TOPIC:-ingestion.embed}
      KAFKA_INGESTION_INDEX_TOPIC: ${KAFKA_INGESTION_INDEX_TOPIC:-ingestion.index}
      KAFKA_RAG_LONG_QUERY_TOPIC: ${KAFKA_RAG_LONG_QUERY_TOPIC:-rag.long_query}
      KAFKA_EVAL_BATCH_TOPIC: ${KAFKA_EVAL_BATCH_TOPIC:-eval.batch}
      KAFKA_RETRY_INGESTION_TOPIC: ${KAFKA_RETRY_INGESTION_TOPIC:-retry.ingestion}
      KAFKA_RETRY_EMBEDDING_TOPIC: ${KAFKA_RETRY_EMBEDDING_TOPIC:-retry.embedding}
      KAFKA_RETRY_INDEXING_TOPIC: ${KAFKA_RETRY_INDEXING_TOPIC:-retry.indexing}
      KAFKA_DLQ_INGESTION_TOPIC: ${KAFKA_DLQ_INGESTION_TOPIC:-dlq.ingestion}
      KAFKA_DLQ_EMBEDDING_TOPIC: ${KAFKA_DLQ_EMBEDDING_TOPIC:-dlq.embedding}
      KAFKA_DLQ_INDEXING_TOPIC: ${KAFKA_DLQ_INDEXING_TOPIC:-dlq.indexing}
      KAFKA_DLQ_RAG_TOPIC: ${KAFKA_DLQ_RAG_TOPIC:-dlq.rag}
    volumes:
      - ./scripts/kafka-topic.sh:/opt/agentic-rag/scripts/kafka-topic.sh:ro
    entrypoint:
      - /bin/bash
      - /opt/agentic-rag/scripts/kafka-topic.sh
    restart: "no"
    networks:
      - eventnet

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_rag}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dbnet

  postgres-init:
    image: pgvector/pgvector:pg16
    container_name: agentic-rag-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_rag}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until pg_isready -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do
          echo "[PostgreSQL] Waiting for database..."
          sleep 2
        done
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
        echo "[PostgreSQL] Vector extension ready"
    restart: "no"
    networks:
      - dbnet

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    container_name: agentic-rag-db-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dbnet

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    container_name: agentic-rag-db-seed
    command: ["python", "scripts/seed_local_db.py"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dbnet

  minio:
    image: minio/minio:latest
    container_name: agentic-rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-agentic_rag}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-agentic_rag_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - storagenet

  minio-init:
    image: minio/mc:latest
    container_name: agentic-rag-minio-init
    depends_on:
      - minio
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-agentic_rag}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-agentic_rag_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-agentic-rag}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local "$${S3_ENDPOINT_URL}" "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"; do
          echo "[MinIO] Waiting for object storage..."
          sleep 2
        done
        mc mb --ignore-existing "local/$${S3_BUCKET_NAME}"
        mc anonymous set none "local/$${S3_BUCKET_NAME}"
        echo "[MinIO] Bucket ready: $${S3_BUCKET_NAME}"
    restart: "no"
    networks:
      - storagenet

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: agentic-rag-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: ${OPENSEARCH_DISABLE_SECURITY_PLUGIN:-true}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - searchnet

networks:
  appnet:
  dbnet:
  eventnet:
  storagenet:
  searchnet:

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  opensearch_data:
    driver: local
